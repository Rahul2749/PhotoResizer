# Explicit opt-in overlay: docker compose -f compose.yaml -f compose.payments.yaml ...
services:
  web:
    depends_on:
      api:
        condition: service_healthy
  api:
    image: photoresizekaro-api:${API_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env.api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 20s
    networks:
      - default
      - payments-db
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  payments-db:
    external: true
    name: ${POSTGRES_NETWORK:?Set POSTGRES_NETWORK to the existing database network after inspecting it}
