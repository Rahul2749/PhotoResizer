worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map "$status:$uri" $asset_cache {
        default "no-cache";
        ~^[0-9]+:/api/ "no-store";
        ~^(200|206|304):/_next/static/ "public, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        client_max_body_size 1k;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $asset_cache always;
        location ^~ /api/ {
            client_max_body_size 64k;
            set $payment_api http://api:3000;
            proxy_pass $payment_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 25s;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            # Preserve the site's header policy; API payloads are JSON and never contain images.
        }
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location = /_headers { return 404; }
        location ~ (^|/)\. { return 404; }
        location ~* \.(map|env|ya?ml|toml|md|ts|tsx|log)$ { return 404; }
        location / { if ($request_method !~ ^(GET|HEAD)$) { return 405; } try_files $uri $uri.html $uri/index.html =404; }
        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
