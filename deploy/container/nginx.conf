worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
    map "$status:$uri" $asset_cache {
        default "no-cache";
        ~^(200|206|304):/_next/static/ "public, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        client_max_body_size 1k;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $asset_cache always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location = /_headers { return 404; }
        location ~ (^|/)\. { return 404; }
        location ~* \.(map|env|ya?ml|toml|md|ts|tsx|log)$ { return 404; }
        location / { try_files $uri $uri.html $uri/index.html =404; }
        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
