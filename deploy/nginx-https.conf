# Host Ubuntu Nginx: install only AFTER the certificate paths below exist.
server {
    listen 80;
    listen [::]:80;
    server_name photoresizekaro.in;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://photoresizekaro.in$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name photoresizekaro.in;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/photoresizekaro.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photoresizekaro.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PhotoResizeTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    error_log /var/log/nginx/photoresizekaro-error.log warn;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host photoresizekaro.in;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
