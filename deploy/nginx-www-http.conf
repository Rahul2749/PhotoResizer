# Optional www bootstrap. Install alongside the existing apex site, not instead of it.
# Verify www DNS points to this VPS before requesting its certificate.
server {
    listen 80;
    listen [::]:80;
    server_name www.photoresizekaro.in;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://photoresizekaro.in$request_uri; }
}
