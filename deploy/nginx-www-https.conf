# Optional www redirect. Install only AFTER the existing certificate covers BOTH
# photoresizekaro.in and www.photoresizekaro.in. Keep the apex site enabled.
server {
    listen 80;
    listen [::]:80;
    server_name www.photoresizekaro.in;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://photoresizekaro.in$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.photoresizekaro.in;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/photoresizekaro.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photoresizekaro.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    return 301 https://photoresizekaro.in$request_uri;
}
